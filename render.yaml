# Render Blueprint. Persistent disks need a paid instance type (starter or above).
services:
  - type: web
    name: pandalai-workday-pto
    runtime: python
    plan: starter
    region: oregon
    numInstances: 1            # OAuth state + token file live on one instance
    buildCommand: pip install -r requirements.txt
    # --no-access-log: the claude.ai URL contains SERVICE_KEY, so never log request paths.
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: token-store
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SERVICE_KEY        # secret in the claude.ai connector URL
        generateValue: true
      - key: ADMIN_KEY          # protects /auth/login, /auth/status, /admin/tools
        generateValue: true
      - key: TOKEN_STORE_PATH
        value: /data/workday_token.json
      - key: WORKDAY_TENANT
        value: wxqmdmpnjn_extdev
      - key: WORKDAY_CLIENT_ID
        sync: false
      - key: WORKDAY_CLIENT_SECRET
        sync: false
      - key: A2A_CLIENT_ID          # the "PTO Workday Agent Bridge" external agent's OAuth client
        sync: false
      - key: A2A_CLIENT_SECRET
        sync: false
      - key: PTO_AGENT_WID          # Workday ID of the Workday-hosted pto-agent (Integration IDs)
        value: eb029fba8fe110010540a7ca5b550000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WORKER_NAME        # the one worker this service acts for (non-secret)
        value: Logan McNeil
      - key: WORKER_ID
        value: 693618e08cc11000cb2ec622bc370001
      - key: MODEL
        value: claude-sonnet-5-5
      - key: ENABLE_WRITE_TOOLS
        value: "true"             # booking tool is still gated by confirm_writes=true per call
